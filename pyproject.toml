[project]
name = "sardis-guard"
version = "0.2.0"
description = "Sardis Guard Intelligence Plane — Financial Intelligence for AI Agent Payments"
requires-python = ">=3.12"
dependencies = [
    "pympp[tempo,server]",
    "fastapi-mpp[tempo]>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
